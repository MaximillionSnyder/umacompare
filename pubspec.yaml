name: uma_cards
description: Umamusume Support Card Viewer & Comparator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  uuid: ^4.0.0
  intl: ^0.19.0
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cards.json
    - assets/images/cards/
